name: shipyard

x-app-env: &app-env
  NODE_ENV: development
  BASE_DOMAIN: localhost
  DATABASE_URL: postgres://shipyard:shipyard@postgres:5432/shipyard
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: deployments
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: minio12345
  S3_FORCE_PATH_STYLE: "true"

# Docker keeps each container's stdout in a JSON file (`docker compose logs`).
# Without these limits the file grows until the container is removed.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: shipyard
      POSTGRES_DB: shipyard
    volumes: [pgdata:/var/lib/postgresql/data]
    # 127.0.0.1: reachable from this machine (migrations, `pnpm dev`), not the LAN.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U shipyard"],
        interval: 5s,
        retries: 10,
      }

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  minio:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 10 }

  minio-init:
    image: pgsty/mc
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb --ignore-existing local/deployments &&
      echo bucket ready"

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    logging: *logging
    environment: { <<: *app-env, PORT: 4000 }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:4000:4000"]

  worker:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    logging: *logging
    environment:
      <<: *app-env
      BUILD_CONCURRENCY: 2
      # Overridable so the e2e run can shorten it: BUILD_TIMEOUT_MS=60000 pnpm infra:up
      BUILD_TIMEOUT_MS: ${BUILD_TIMEOUT_MS:-900000}
      # Must name the same host directory as the /builds mount below: the worker
      # clones into /builds, then asks the host's Docker daemon to bind-mount it
      # into build containers by its host path. Both use ${PWD} (not ./, which
      # compose resolves relative to this file) so they can't drift apart.
      # ${PWD} is the repo root under `pnpm infra:up`.
      BUILDS_HOST_PATH: ${PWD}/data/builds
      # Builds reach the internet only through this proxy (see build-proxy below).
      BUILD_HTTP_PROXY: http://build-proxy:3128
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/data/builds:/builds
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      build-proxy: { condition: service_started }
    # Not on build_egress: the worker drives builds through the Docker API, never
    # over the network, so builds have no reason to reach it.

  build-proxy:
    image: ubuntu/squid:6.13-25.04_beta
    logging: *logging
    volumes: ["./build-proxy/squid.conf:/etc/squid/squid.conf:ro"]
    # build_egress to take requests from builds; proxy_out, and only that, to
    # reach the internet. Deliberately not on `default`, so it can't even
    # resolve postgres, redis or minio; squid.conf also refuses private IPs.
    networks: [build_egress, proxy_out]

  router:
    build: { context: .., dockerfile: apps/router/Dockerfile }
    logging: *logging
    environment: { <<: *app-env, PORT: 4001 }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:4001:4001"]
    # /__health, not /health — the router serves user sites on wildcard
    # subdomains, so a bare /health would collide with a deployed site's own.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:4001/__health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      retries: 10

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile, target: dev }
    # Host edits hot-reload inside the container.
    volumes: [../apps/web/src:/repo/apps/web/src]
    ports: ["127.0.0.1:5173:5173"]

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api, router, web]

networks:
  default: {}
  build_egress:
    # The only network build containers join. `internal`: no route to the host,
    # its published ports, other networks, or the internet. The one way out is
    # build-proxy, which allows public hosts only. Without `internal`, builds
    # could reach postgres/redis/minio through the host's published ports.
    name: shipyard_build_egress
    driver: bridge
    internal: true
  proxy_out:
    # build-proxy's route to the internet. Nothing else joins it.
    driver: bridge

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  caddydata: {}
