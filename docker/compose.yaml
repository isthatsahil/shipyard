name: shipyard

x-app-env: &app-env
  NODE_ENV: development
  BASE_DOMAIN: localhost
  DATABASE_URL: postgres://shipyard:shipyard@postgres:5432/shipyard
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: deployments
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: minio12345
  S3_FORCE_PATH_STYLE: "true"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: shipyard
      POSTGRES_DB: shipyard
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U shipyard"],
        interval: 5s,
        retries: 10,
      }

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  minio:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 10 }

  minio-init:
    image: pgsty/mc
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb --ignore-existing local/deployments &&
      echo bucket ready"

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment: { <<: *app-env, PORT: 4000 }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["4000:4000"]

  worker:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    environment:
      <<: *app-env
      BUILD_CONCURRENCY: 2
      BUILD_TIMEOUT_MS: 900000
      BUILDS_HOST_PATH: ${PWD}/data/builds # host path of the shared volume (see Phase 1)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/builds:/builds
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [default, build_egress]

  router:
    build: { context: .., dockerfile: apps/router/Dockerfile }
    environment: { <<: *app-env, PORT: 4001 }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["4001:4001"]
    # /__health, not /health — the router serves user sites on wildcard
    # subdomains, so a bare /health would collide with a deployed site's own.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:4001/__health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      retries: 10

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile, target: dev }
    # Host edits hot-reload inside the container.
    volumes: [../apps/web/src:/repo/apps/web/src]
    ports: ["5173:5173"]

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api, router, web]

networks:
  default: {}
  build_egress:
    # Builder containers join only this network: they can reach the internet
    # but not postgres/redis/minio, which live on `default`.
    name: shipyard_build_egress
    driver: bridge

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  caddydata: {}
